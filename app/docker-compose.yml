services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sre_playground
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_PREFIX: http://localstack:4566/000000000000
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE: articles
      QUEUE_CONNECTION: sqs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work sqs --sleep=3 --tries=3
    volumes:
      - ./src:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_DATABASE: sre_playground
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_PREFIX: http://localstack:4566/000000000000
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE: articles
      QUEUE_CONNECTION: sqs
    depends_on:
      - app

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sre_playground
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEFAULT_REGION: ap-northeast-1
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d

volumes:
  mysql_data:
